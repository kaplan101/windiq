[project]
name = "windiq-backend"
version = "0.1.0"
description = "Live-Ertragsrechnung: Messdaten-Sync, AEP/P50/P90 und REST-API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]
