services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: windiq
      POSTGRES_PASSWORD: windiq
      POSTGRES_DB: windiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windiq -d windiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Im Docker-Netz heißt die Datenbank "db", nicht "localhost"
      DATABASE_URL: postgresql+psycopg://windiq:windiq@db:5432/windiq
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
