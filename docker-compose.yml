services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: windiq
      POSTGRES_PASSWORD: windiq
      POSTGRES_DB: windiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windiq -d windiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
